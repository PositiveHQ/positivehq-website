<svg width="1180" height="280" viewBox="0 0 1180 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Positive Watch HQ PW dial logo</title>
  <desc id="desc">A refined Positive Watch HQ logo with a PW watch-dial emblem, white serif lettering, and champagne gold accents.</desc>
  <defs>
    <linearGradient id="gold" x1="52" y1="20" x2="320" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B5"/>
      <stop offset="0.32" stop-color="#D9B76B"/>
      <stop offset="0.64" stop-color="#8B6824"/>
      <stop offset="1" stop-color="#F7E2A6"/>
    </linearGradient>
    <linearGradient id="white" x1="270" y1="66" x2="1100" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#E6EDF5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-35%" width="120%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D9B76B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(132 140)">
      <circle r="94" fill="#020814" stroke="url(#gold)" stroke-width="4"/>
      <circle r="82" fill="none" stroke="#123A6F" stroke-width="6" opacity="0.86"/>
      <circle r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
      <g stroke="url(#gold)" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-47" stroke-width="2.6"/>
        <line x1="58" y1="0" x2="47" y2="0" stroke-width="2.6"/>
        <line x1="0" y1="58" x2="0" y2="47" stroke-width="2.6"/>
        <line x1="-58" y1="0" x2="-47" y2="0" stroke-width="2.6"/>
        <line x1="29" y1="-50.2" x2="24" y2="-41.6" stroke-width="1.3" opacity="0.68"/>
        <line x1="50.2" y1="-29" x2="41.6" y2="-24" stroke-width="1.3" opacity="0.68"/>
        <line x1="50.2" y1="29" x2="41.6" y2="24" stroke-width="1.3" opacity="0.68"/>
        <line x1="29" y1="50.2" x2="24" y2="41.6" stroke-width="1.3" opacity="0.68"/>
        <line x1="-29" y1="50.2" x2="-24" y2="41.6" stroke-width="1.3" opacity="0.68"/>
        <line x1="-50.2" y1="29" x2="-41.6" y2="24" stroke-width="1.3" opacity="0.68"/>
        <line x1="-50.2" y1="-29" x2="-41.6" y2="-24" stroke-width="1.3" opacity="0.68"/>
        <line x1="-29" y1="-50.2" x2="-24" y2="-41.6" stroke-width="1.3" opacity="0.68"/>
      </g>
      <path d="M-25 -36 L-12 -52 L0 -39 L12 -52 L25 -36" fill="none" stroke="url(#gold)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>
      <text x="0" y="22" text-anchor="middle" font-family="Didot, Bodoni 72, Bodoni MT, Cinzel, Cormorant Garamond, Times New Roman, serif" font-size="62" font-weight="500" letter-spacing="-4" fill="url(#white)">PW</text>
      <circle r="2.8" fill="url(#gold)"/>
    </g>

    <text x="276" y="126" font-family="Didot, Bodoni 72, Bodoni MT, Cinzel, Cormorant Garamond, Times New Roman, serif" font-size="72" font-weight="500" letter-spacing="10" fill="url(#white)">POSITIVE</text>
    <text x="278" y="190" font-family="Didot, Bodoni 72, Bodoni MT, Cinzel, Cormorant Garamond, Times New Roman, serif" font-size="42" font-weight="500" letter-spacing="14" fill="url(#gold)">WATCH HQ</text>
    <line x1="278" y1="220" x2="435" y2="220" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.88"/>
    <circle cx="474" cy="220" r="3.6" fill="url(#gold)"/>
    <line x1="513" y1="220" x2="670" y2="220" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.88"/>
  </g>
</svg>
